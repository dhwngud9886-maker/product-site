<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>제품 소개</title>

  <style>
    :root{
      --bg:#f7fbff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e5e7eb;

      --blue:#2563eb;
      --sky:#38bdf8;
      --sky-soft:#e0f2fe;

      --radius:16px;
      --shadow-sm: 0 8px 18px rgba(15,23,42,.08);
      --shadow: 0 14px 32px rgba(15,23,42,.12);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    a{color:inherit}

    .container{max-width:1200px;margin:0 auto;padding:0 18px}

    /* ===== Header (logo + search + icons) ===== */
    header{
      background:#ffffff;
      border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:50;
    }
    .header-main{
      display:flex; align-items:center; gap:18px;
      padding:16px 0;
    }
    .logo{
      display:flex; align-items:center; gap:10px;
      font-weight:1000; letter-spacing:.2px;
      white-space:nowrap;
    }
    .logo-mark{
      width:34px; height:34px; border-radius:12px;
      background: linear-gradient(135deg, var(--blue), var(--sky));
      box-shadow: 0 10px 18px rgba(37,99,235,.25);
    }
    .logo span.small{font-weight:900; color:var(--muted); font-size:12px; display:block; margin-top:2px}

    .search{
      flex:1;
      display:flex;
      align-items:center;
      border:2px solid rgba(37,99,235,.75);
      border-radius:999px;
      padding:10px 12px;
      gap:10px;
      min-width:280px;
    }
    .search input{
      border:0; outline:none; width:100%;
      font-size:14px;
    }
    .search button{
      border:0; cursor:pointer;
      background:transparent;
      width:36px; height:36px;
      border-radius:999px;
    }
    .search button:hover{ background:rgba(37,99,235,.08) }

    .icons{
      display:flex; gap:14px; align-items:center;
    }
    .icon-btn{
      display:flex; flex-direction:column; align-items:center; gap:6px;
      text-decoration:none;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      padding:6px 6px;
      border-radius:12px;
    }
    .icon-btn:hover{
      color:var(--text);
      background: rgba(2,132,199,.08);
    }
    .icon{
      width:24px; height:24px; border-radius:8px;
      border:1px solid var(--border);
      display:grid; place-items:center;
      color: var(--blue);
      background:#fff;
    }

    /* ===== Category nav ===== */
    .nav{
      border-top:1px solid var(--border);
      background:#ffffff;
    }
    .nav-row{
      display:flex; align-items:center; gap:10px;
      padding:10px 0;
      overflow:auto;
    }
    .allcat{
      display:flex; align-items:center; gap:10px;
      background: var(--blue);
      color:#fff;
      font-weight:1000;
      border-radius:12px;
      padding:10px 14px;
      white-space:nowrap;
      text-decoration:none;
    }
    .allcat:hover{ filter:brightness(.98) }
    .nav a.item{
      text-decoration:none;
      font-weight:900;
      color: var(--text);
      padding:10px 12px;
      border-radius:12px;
      white-space:nowrap;
      border:1px solid transparent;
    }
    .nav a.item:hover{
      background: var(--sky-soft);
      border-color: rgba(56,189,248,.35);
    }
    .nav a.item.active{
      background: rgba(37,99,235,.08);
      border-color: rgba(37,99,235,.25);
      color: var(--blue);
    }

    /* ===== Banner slider ===== */
    .banner-wrap{ padding:18px 0; }
    .banner{
      position:relative;
      border-radius: 20px;
      overflow:hidden;
      box-shadow: var(--shadow);
      background:#0b1220;
    }
    .slides{ display:flex; transition: transform .45s ease; will-change: transform; }
    .slide{
      min-width:100%;
      height: 360px;
      position:relative;
      color:#fff;
      display:grid;
      place-items:center;
      background: radial-gradient(900px 400px at 20% 30%, rgba(56,189,248,.35), rgba(0,0,0,.85));
    }
    .slide .content{
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns: 1.2fr 1fr;
      align-items:center;
      gap:16px;
      padding: 26px 28px;
    }
    .headline{ max-width:560px; }
    .headline h2{
      margin:0 0 10px;
      font-size:40px;
      line-height:1.1;
      letter-spacing:-.5px;
    }
    .headline p{
      margin:0 0 16px;
      color: rgba(255,255,255,.82);
      line-height:1.6;
      font-size:14px;
    }
    .banner-cta{ display:flex; gap:10px; flex-wrap:wrap; }
    .btn{
      border:0; cursor:pointer;
      padding:11px 14px;
      border-radius:14px;
      font-weight:1000;
      background: var(--sky);
      color:#00202e;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn:hover{ filter:brightness(.98) }
    .btn.ghost{
      background:transparent;
      color:#fff;
      border:1px solid rgba(255,255,255,.25);
    }

    .hero-img{
      width:100%;
      height: 100%;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.14);
      background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.02));
      display:grid; place-items:center;
      position:relative;
      overflow:hidden;
    }
    .hero-img .tag{
      position:absolute; left:14px; top:14px;
      background: rgba(56,189,248,.22);
      border: 1px solid rgba(56,189,248,.35);
      padding:6px 10px;
      border-radius:999px;
      font-weight:900;
      font-size:12px;
    }
    .hero-img img{ width:100%; height:100%; object-fit:cover; display:block; }
    .hero-img .ph{ text-align:center; color: rgba(255,255,255,.75); font-weight:900; }

    .nav-arrow{
      position:absolute; top:50%;
      transform:translateY(-50%);
      width:44px; height:44px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.35);
      color:#fff;
      cursor:pointer;
      display:grid; place-items:center;
      z-index:2;
    }
    .nav-arrow:hover{ background: rgba(0,0,0,.5) }
    .nav-arrow.prev{ left:14px }
    .nav-arrow.next{ right:14px }

    .dots{
      position:absolute;
      left:50%; bottom:14px;
      transform:translateX(-50%);
      display:flex; gap:8px;
      z-index:2;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(255,255,255,.35);
      cursor:pointer;
      border:1px solid rgba(255,255,255,.25);
    }
    .dot.active{ background: rgba(56,189,248,.95) }

    /* ===== Main ===== */
    main{ padding:0 0 60px }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding:18px;
    }
    .title{
      display:flex; justify-content:space-between; align-items:flex-end; gap:12px;
      margin-bottom:12px;
    }
    .title h1{ margin:0; font-size:22px; letter-spacing:-.2px }
    .title p{ margin:0; color:var(--muted); font-size:13px }

    .toolbar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin:14px 0 16px;
    }
    .input, .select{
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      padding:11px 12px;
      outline:none;
      color:var(--text);
    }
    .input{ flex:1; min-width:240px }
    .input:focus, .select:focus{
      border-color: rgba(56,189,248,.75);
      box-shadow: 0 0 0 4px rgba(56,189,248,.18);
    }
    .btn2{
      border:0; cursor:pointer;
      padding:11px 12px;
      border-radius:14px;
      font-weight:1000;
      background: var(--blue);
      color:#fff;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn2.ghost{
      background:#fff;
      color:var(--blue);
      border:1px solid rgba(37,99,235,.25);
    }

    /* Products grid */
    .grid{
      display:grid;
      gap:14px;
      grid-template-columns: repeat(4, minmax(0,1fr));
    }
    .p-card{
      position: relative;
      background:#fff;
      border:1px solid var(--border);
      border-radius: 16px;
      overflow:hidden;
      box-shadow: var(--shadow-sm);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      display:flex; flex-direction:column;
    }
    .p-card:hover{
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: rgba(56,189,248,.35);
    }
/* ===== 태그 기본 숨김 ===== */
.p-card .p-body .chips{
  opacity: 0;
  visibility: hidden;
  transform: translateY(6px);
  pointer-events: none;
  transition: all .18s ease;
}

/* ===== 카드 hover 시 태그 표시 ===== */
.p-card:hover .p-body .chips{
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: auto;
}

/* ===== 모바일에서는 항상 표시 ===== */
@media (max-width: 640px){
  .p-card .p-body .chips{
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
  }
}


/* === 제품 목록 썸네일 (안 잘리고 전체 보이게) === */
.p-thumb{
  width: 100%;
  height: 360px;                 /* 썸네일 세로 길이 */
  background: #f8fafc;           /* 여백 생겨도 깔끔 */
  border-bottom: 1px solid #e5e7eb;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}

.p-thumb img{
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;           /* ⭐ 핵심: 안 잘리고 전체 보임 */
}

    .badge{
      position:absolute; left:12px; top:12px;
      background: var(--sky-soft);
      border:1px solid rgba(56,189,248,.35);
      color: #0369a1;
      font-weight:1000;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
    }
    .p-body{
  padding:12px;
  display:flex;
  flex-direction:column;
  flex:1;              /* ✅ 남는 높이 먹기 */
}

    .p-name{ font-weight:1000; margin:0 0 6px; font-size:14px }
    .p-sub{ margin:0; color:var(--muted); font-size:12px; line-height:1.45 }
    .chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px }
    .chip{
      font-size:11px;
      font-weight:900;
      background:#f1f5f9;
      border:1px solid #e2e8f0;
      padding:5px 9px;
      border-radius:999px;
    }
   .p-bottom{
  margin-top:auto;     /* ✅ 항상 맨 아래로 */
  padding-top:12px;    /* 기존 12px 간격 유지 */
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}

    .price{ font-weight:1000; font-size:13px }
    .detail-btn{
      border:0; cursor:pointer;
      padding:9px 10px;
      border-radius:12px;
      font-weight:1000;
      background: var(--sky);
      color:#00202e;
    }

    /* Detail */
    .detail{
      display:grid; gap:14px;
      grid-template-columns: 1.35fr .65fr;
      align-items:start;
    }
    .panel{
      background:#fff;
      border:1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      padding:16px;
    }

    /* 왼쪽: 메인 이미지 + 갤러리 */
    .detail-img{
      height: 520px;
      border-radius:16px;
      overflow:hidden;
      border:1px solid var(--border);
      background: #f8fafc;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .detail-img img{ width:100%; height:100%; object-fit:contain; display:block }

    .gallery-strip{
      display:flex;
      gap:10px;
      margin-top:10px;
      overflow:auto;
      padding-bottom:4px;
    }
    .gthumb{
      border:1px solid #e5e7eb;
      background:#fff;
      border-radius:12px;
      padding:0;
      cursor:pointer;
      width:90px;
      height:68px;
      overflow:hidden;
      flex:0 0 auto;
    }
    .gthumb img{ width:100%; height:100%; object-fit:cover; display:block }
    .gthumb.active{
      border-color: rgba(56,189,248,.85);
      box-shadow: 0 0 0 4px rgba(56,189,248,.18);
    }

    /* 오른쪽 스펙 */
    .specs{ list-style:none; padding:0; margin:10px 0 0 }
    .specs li{
      display:flex; justify-content:space-between; gap:12px;
      padding:10px 0;
      border-bottom:1px solid #eef2f7;
      color: var(--muted);
      font-size:13px;
    }
    .specs b{ color:var(--text) }

    /* 자부담금 가격만 빨간색 */
.specs li.self-pay b{
  color: #dc2626;     /* 빨간색 */
  font-weight: 1000;
}


    /* 상세 하단 긴 이미지 섹션 */
    .detail-stack{
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .detail-shot{
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      background:#fff;
      box-shadow: var(--shadow-sm);
    }
    .detail-shot img{
      width:100%;
      height:auto;
      display:block;
    }

    /* 스펙 표 이미지(선택) */
    .spec-image{
      margin-top:12px;
      border:1px solid var(--border);
      border-radius:16px;
      overflow:hidden;
      background:#fff;
      box-shadow: var(--shadow-sm);
    }
    .spec-image img{ width:100%; height:auto; display:block; }

    footer{
      padding:18px 0;
      border-top:1px solid var(--border);
      color:#94a3b8;
      font-size:12px;
      background:#fff;
      margin-top:36px;
    }

    /* Responsive */
    @media (max-width:1100px){
      .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); }
      .slide .content{ grid-template-columns: 1fr; }
      .headline h2{ font-size:34px; }
      .slide{ height: 380px; }
      .detail{ grid-template-columns: 1fr; }
      .detail-img{ height: 480px; }
    }
@media (max-width:640px){

  /* ===== 기존 코드 유지 ===== */
  .icons{ display:none; }
  .search{ min-width:0; }
  .grid{ grid-template-columns:1fr; }
  .headline h2{ font-size:28px; }
  .slide{ height:360px; }
  .nav-arrow{ display:none; }
  .detail-img{ height:420px; }
  .gthumb{ width:78px; height:58px; }

  /* ===== 여기부터 추가 ===== */

  .header-main{
    display:flex;
    flex-wrap: nowrap;      /* 🔥 줄바꿈 금지 */
    align-items: center;
    gap: 10px;
  }

  .logo{
    flex: 0 0 auto;
    text-decoration:none;  /* 밑줄 제거 */
  }

  .logo .small{
    display:none;           /* 모바일에서 보조 문구 숨김 */
  }

  .search{
    flex: 1 1 auto;
    max-width: 100%;
  }

  .search input{
    width:100%;
    font-size:13px;
    white-space:nowrap;
  }
    /* ===== 모바일에서는 슬라이더 완전 해제 ===== */
  .grid.slider{
    display: grid !important;
    overflow: visible !important;
    padding: 0 !important;
    scroll-snap-type: none !important;
  }

  .grid.slider .p-card{
    flex: none !important;
    min-width: 0 !important;
  }

  /* 슬라이더 화살표 숨김 */
  .slide-arrow{
    display:none !important;
  }

  /* 카드 썸네일 모바일 높이 조정 */
  .p-thumb{
    height: 260px;
  }

}

    .detail-images{
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.detail-images img{
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  border-radius: 12px;
}
/* 헤더 한 줄 고정 */
.header-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:nowrap;     /* 줄바꿈 금지 */
}

/* 로고 줄바꿈 방지 + 밑줄 제거 */
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  white-space:nowrap;
  text-decoration:none; /* 밑줄 제거 */
  color:inherit;
}

/* 검색창이 가운데서 늘어나게 */
.search{
  flex:1;
  display:flex;
  align-items:center;
  gap:10px;
  max-width:720px;      /* 너무 길어지는 거 방지 */
  min-width:240px;      /* 너무 작아져서 깨지는 거 방지 */
}

/* 검색 input이 flex에서 줄바꿈 유발하는 걸 막는 핵심 */
.search input{
  flex:1;
  min-width:0;          /* ⭐이게 없으면 줄바꿈/깨짐 자주 생김 */
  white-space:nowrap;
}

/* input 테두리/밑줄 느낌 제거(원하면) */
.search input{
  border:none;
  outline:none;
  box-shadow:none;
  background:transparent;
}

/* 검색창 테두리는 search 컨테이너에 주는 게 깔끔 */
.search{
  border:2px solid #4c7dff;
  border-radius:999px;
  padding:10px 16px;
}

/* 오른쪽 아이콘 줄바꿈 방지 */
.icons{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:nowrap;
  white-space:nowrap;
}
/* ===== 제품 슬라이더 ===== */
.product-slider{
  position: relative;
}

.grid.slider{
  display: flex;
  gap: 20px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 10px 40px;
}
@media (max-width: 1100px){
  .grid.slider .p-card{ flex: 0 0 calc((100% - 20px) / 2); }
}
@media (max-width: 640px){
  .grid.slider .p-card{ flex: 0 0 100%; }
}

/* 스크롤바 숨김 */
.grid.slider::-webkit-scrollbar{
  display: none;
}
.grid.slider{
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* ✅ 한 화면에 4개 고정 */
.grid.slider{
  display:flex;
  gap:20px;
  overflow-x:auto;
  scroll-behavior:smooth;
  padding:10px 40px;
  scroll-snap-type:x mandatory;   /* ✅ 스냅(딱딱 맞게 넘어가게) */
}

.grid.slider .p-card{
  flex: 0 0 calc((100% - 20px*3) / 4);  /* ✅ 4개 */
  min-width: calc((100% - 20px*3) / 4);
  scroll-snap-align:start;
}


/* 화살표 */
.slide-arrow{
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: #fff;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
  cursor: pointer;
  font-size: 22px;
  z-index: 10;
}

.slide-arrow.left{ left: 0; }
.slide-arrow.right{ right: 0; }

.slide-arrow:hover{
  background: #f0f6ff;
}



.side-card{
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-sm);
  padding: 14px;
}

.side-title{
  font-weight: 1000;
  font-size: 14px;
  margin-bottom: 10px;
}

.side-list{
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.side-list li{
  display: flex;
  gap: 8px;
  align-items: baseline;
  justify-content: space-between;
  font-size: 13px;
}

.side-list a{
  text-decoration: none;
  color: var(--text);
  font-weight: 800;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.side-list a:hover{
  color: var(--blue);
}

.side-date{
  color: var(--muted);
  font-size: 12px;
  flex: 0 0 auto;
}

/* ✅ 화면이 좁으면 오른쪽 패널 숨김(모바일/작은 화면) */
@media (max-width: 1300px){
  .side-panel{ display: none; }
}
/* =========================
   오른쪽 플로팅 퀵 메뉴
========================= */
.quick-menu{
  position: fixed;
  right: 18px;
  top: 50%;

  function escapeHtml(str=""){
    return String(str)
      .replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&#34;")
      .replaceAll("'","&#039;");
  }
  function qs(sel, root=document){ return root.querySelector(sel); }

  function parseHashQuery(){
    const raw = location.hash || "#/";
    const idx = raw.indexOf("?");
    if(idx < 0) return {};
    const qs = raw.slice(idx+1);
    const out = {};
    qs.split("&").forEach(pair=>{
      const [k,v] = pair.split("=");
      out[decodeURIComponent(k)] = decodeURIComponent(v || "");
    });
    return out;
  }
 function setHashQuery(basePath, queryObj){
  const q = Object.entries(queryObj)
    .filter(([,v])=>v !== "" && v != null)
    .map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
    .join("&");

  const newHash = q ? `${basePath}?${q}` : basePath;

  // ✅ hashchange를 발생시키지 않고 URL만 갱신
  history.replaceState(null, "", "#" + newHash.replace(/^#/, ""));
}

  function renderBanner(){
    slidesEl.innerHTML = BANNERS.map(slideTemplate).join("");

    goBanner(0, true);

    qsa(".dot", dotsEl).forEach(d=>{
      d.addEventListener("click", ()=>{
        goBanner(Number(d.dataset.i));
        restartBannerAuto();
      });
    });

    qs("#prevBtn").addEventListener("click", ()=>{ prevBanner(); restartBannerAuto(); });
    qs("#nextBtn").addEventListener("click", ()=>{ nextBanner(); restartBannerAuto(); });

    restartBannerAuto();
  }

  function goBanner(i, immediate=false){
    bannerIndex = (i + BANNERS.length) % BANNERS.length;
    slidesEl.style.transition = immediate ? "none" : "transform .45s ease";
    slidesEl.style.transform = `translateX(-${bannerIndex*100}%)`;
    qsa(".dot", dotsEl).forEach((d,idx)=> d.classList.toggle("active", idx===bannerIndex));
  }
  function nextBanner(){ goBanner(bannerIndex+1); }
  function prevBanner(){ goBanner(bannerIndex-1); }
  function restartBannerAuto(){
    if(bannerTimer) clearInterval(bannerTimer);
    bannerTimer = setInterval(nextBanner, 5000);
  }

    function apply(){
      const qText = (searchEl.value||"").trim().toLowerCase();

      const filtered = PRODUCTS.filter(p=>{
        const hay = `${p.name} ${p.short} ${p.description} ${(p.tags||[]).join(" ")} ${p.category}`.toLowerCase();

      grid.innerHTML = filtered.map(card).join("") || `

// ✅ 한글 조합 시작/끝 감지
searchEl.addEventListener("compositionstart", ()=>{ isComposing = true; });
searchEl.addEventListener("compositionend", ()=>{
